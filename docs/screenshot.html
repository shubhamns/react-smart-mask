<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>react-smart-mask preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 480px;
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #0f172a;
      }
      .card {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 20px;
      }
      .field {
        margin-bottom: 16px;
      }
      .field:last-child {
        margin-bottom: 0;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        display: block;
        width: 100%;
        font-size: 16px;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
      }
      .meta {
        margin-top: 4px;
        font-size: 11px;
        color: #64748b;
        font-family: ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>react-smart-mask</h1>
      <div class="field">
        <label>Phone</label>
        <input value="+91 98765 43210" readonly />
        <div class="meta">raw: 9876543210 · complete: true</div>
      </div>
      <div class="field">
        <label>Date</label>
        <input value="29/09/____" readonly />
        <div class="meta">raw: 2909 · complete: false</div>
      </div>
      <div class="field">
        <label>PIN</label>
        <input value="12__" readonly />
        <div class="meta">raw: 12 · complete: false</div>
      </div>
    </div>
  </body>
</html>
