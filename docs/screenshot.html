<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>react-smart-mask preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 45%, #0f172a 100%);
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      width: min(520px, 100%);
      background: #fff;
      color: #0f172a;
      border-radius: 16px;
      padding: 28px 28px 24px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 4px;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .sub {
      margin: 0 0 22px;
      color: #64748b;
      font-size: 0.875rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .field { margin-bottom: 18px; }
    input {
      width: 100%;
      font-size: 1.05rem;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      color: #0f172a;
    }
    input:focus {
      outline: 2px solid #6366f1;
      border-color: #6366f1;
      background: #fff;
    }
    .meta {
      margin-top: 6px;
      font-size: 0.72rem;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .badge {
      display: inline-block;
      margin-top: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .pkg {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.8rem;
      color: #64748b;
    }
    code { color: #4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <h1>react-smart-mask</h1>
    <p class="sub">Formatted display · raw value · completion state</p>
    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" value="+91 98765 43210" readonly />
      <div class="meta">raw: 9876543210 · complete: true</div>
    </div>
    <div class="field">
      <label for="date">Date</label>
      <input id="date" value="29/09/2026" readonly />
      <div class="meta">raw: 29092026 · complete: true</div>
    </div>
    <div class="field">
      <label for="pin">PIN (partial)</label>
      <input id="pin" value="12" readonly />
      <div class="meta">raw: 12 · complete: false</div>
    </div>
    <span class="badge">Mask literals auto-inserted</span>
    <p class="pkg">Install: <code>npm i react-smart-mask</code></p>
  </div>
</body>
</html>
